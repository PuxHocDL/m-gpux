name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install --upgrade -e ".[dev]"
      - name: Lint
        run: ruff check m_gpux tests
      - name: Check formatting
        run: ruff format --check m_gpux tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: m-gpux-vscode/package-lock.json
      - name: Install dependencies
        working-directory: m-gpux-vscode
        run: npm ci
      - name: Audit dependencies
        working-directory: m-gpux-vscode
        run: npm audit --audit-level=high
      - name: Type-check
        working-directory: m-gpux-vscode
        run: npm run typecheck
      - name: Package VSIX with bundled CLI
        working-directory: m-gpux-vscode
        run: npm run package

  web:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: m-gpux-ui/package-lock.json
      - name: Install dependencies
        working-directory: m-gpux-ui
        run: npm ci
      - name: Audit dependencies
        working-directory: m-gpux-ui
        run: npm audit --audit-level=high
      - name: Build landing page and docs
        working-directory: m-gpux-ui
        run: npm run build
