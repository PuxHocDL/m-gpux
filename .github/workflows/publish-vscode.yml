name: Publish VS Code Extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to publish (e.g. v2.5.0). Leave blank to use the latest tag on main.'
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tag from push)
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Checkout (manual ref)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: m-gpux-vscode/package-lock.json

      - name: Install dependencies
        working-directory: m-gpux-vscode
        run: npm ci

      - name: Type check
        working-directory: m-gpux-vscode
        run: npx tsc --noEmit

      - name: Verify package.json version matches tag
        working-directory: m-gpux-vscode
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.inputs.ref || github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          echo "package.json: $PKG_VERSION"
          echo "tag:          $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Package VSIX
        working-directory: m-gpux-vscode
        run: npx vsce package

      - name: Publish to VS Code Marketplace
        working-directory: m-gpux-vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath m-gpux-*.vsix -p "$VSCE_PAT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.ref || github.ref_name }}
          name: ${{ github.event.inputs.ref || github.ref_name }}
          files: m-gpux-vscode/m-gpux-*.vsix
          generate_release_notes: true
